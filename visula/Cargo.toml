[package]
name = "visula"
description = "Visualization library based on wgpu"
version.workspace = true
authors.workspace = true
edition = "2018"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../README.md"
keywords = ["visualization", "wgpu", "webgpu", "graphics", "plotting"]
categories = ["visualization", "graphics", "rendering", "wasm"]
exclude = ["examples/*.blend"]

[dependencies]
visula-core = { workspace = true }
visula-derive = { workspace = true }
wgpu = {workspace = true}
glam = {workspace = true}
naga = {workspace = true}
log = {workspace = true}
bytemuck = {workspace = true}
winit = { workspace = true}
egui = {workspace = true}
egui-wgpu = {workspace = true}
egui-winit = {workspace = true}
pollster = { workspace = true }
itertools = { workspace = true }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2.104"
cgmath = "0.17.0"
thiserror = {workspace = true}
gltf = "0.15.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rand = "0.9"
chrono = "0.4.42"
web-time = "1.1.0"
lyon = "1.0.16"
ttf-parser = "0.25.1"
fdsm = "0.8.0"

[dev-dependencies]
itertools-num = "0.1.3"
hecs = "0.10.5"
strum = { version = "0.25.0", features = ["derive"] }
slotmap = "1.0.7"
clap = { version = "4.5.50", features = ["derive"] }
usvg = "0.47.0"
wgpu = {workspace = true, features = ["noop"]}

[target.'cfg(not(target_arch = "wasm32"))'.build-dependencies]
pyo3-build-config = { workspace = true, optional = true }

[features]
python = ["visula-core/python", "dep:pyo3", "dep:pyo3-build-config"]

[dependencies.web-sys]
version = "0.3"
features = [
  "Blob",
  "CssStyleDeclaration",
  "DataTransfer",
  "File",
  "FileList",
  "DataTransferItemList",
  "DragEvent",
  "HtmlElement",
  "Window",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pyo3 = { workspace = true, optional = true }
env_logger = {workspace = true}

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "0.2.2"
getrandom = { version = "0.3", features = ["wasm_js"] }
