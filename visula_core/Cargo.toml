[package]
name = "visula-core"
description = "Expressions, buffers and shader generation for visula"
version.workspace = true
authors.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["visualization", "wgpu", "naga", "shader"]
categories = ["visualization", "graphics", "rendering"]

[dependencies]
wgpu = {workspace = true}
glam = {workspace = true}
naga = {workspace = true}
uuid = {workspace = true}
log = {workspace = true}
bytemuck = {workspace = true}
itertools = {workspace = true}
thiserror = {workspace = true}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pyo3 = { workspace = true, optional = true }

[features]
python = ["dep:pyo3"]

[dev-dependencies]
env_logger = {workspace = true}
insta = "1"
visula-derive = {path = "../visula_derive"}
wgpu = {workspace = true, features = ["noop"]}
