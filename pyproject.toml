[project]
name = "visula-workspace"
version = "0.1.0"
description = "Visula workspace root"
requires-python = ">=3.11"
dependencies = ["visula"]

[tool.uv]
package = false

[tool.uv.sources]
visula = { workspace = true }

[tool.uv.workspace]
members = ["visula_pyo3"]

[dependency-groups]
dev = ["maturin>=1.8.1"]
